<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Transposons as genome ecology</title>
    <style>
      /* box-sizing here is load-bearing, not hygiene. #stage is a 100vh grid
         item with 8px padding, and under the default content-box that padding is
         ADDED to 100vh -- the stage overflowed the viewport by 16px, and the
         third canvas was clipped at the fold with no bottom border while the
         first two closed cleanly. min-height:0 stops a grid item's auto minimum
         from re-inflating the rows. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #0d0f12;
        color: #d8dee9;
        font:
          13px/1.5 system-ui,
          sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 1fr 320px;
        height: 100vh;
        overflow: hidden;
      }
      #stage {
        display: grid;
        grid-template-rows: 1fr 180px 220px;
        gap: 8px;
        padding: 8px;
        min-width: 0;
        min-height: 0;
      }
      #stage > canvas {
        min-height: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #14181d;
        border-radius: 4px;
      }
      #controls {
        padding: 12px;
        border-left: 1px solid #232830;
        overflow-y: auto;
        min-height: 0;
      }
      #controls label {
        display: block;
        margin: 10px 0 2px;
        color: #9aa5b1;
      }
      #controls input[type="range"] {
        width: 100%;
      }
      #readout {
        font-variant-numeric: tabular-nums;
        white-space: pre;
        color: #8fbcbb;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #legend {
        margin-top: 16px;
        color: #9aa5b1;
      }
      #legend div {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0;
      }
      #legend i {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        display: inline-block;
        flex: none;
      }
      /* Task 18's controls land here. Reserved deliberately so the column reads
         as "not yet built" rather than as an accidental 320x550 hole. */
      #controls-slot {
        margin-top: 18px;
        padding: 10px 12px;
        border: 1px dashed #232830;
        border-radius: 4px;
        color: #5b6672;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="field"></canvas>
        <canvas id="timeline"></canvas>
        <canvas id="scatter"></canvas>
      </div>
      <div id="controls">
        <div id="readout"></div>
        <div id="legend">
          <div><i style="background: #bf616a"></i> active</div>
          <div><i style="background: #4c566a"></i> silenced</div>
          <div><i style="background: #a3be8c"></i> domesticated</div>
          <div>
            <i style="background: #4a6f9e"></i> piRNA cluster — the trap
          </div>
          <div><i style="background: #8a6d2f"></i> beneficial sites</div>
        </div>
        <div id="controls-slot">Controls arrive in Task 18.</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
